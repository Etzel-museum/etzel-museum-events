<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אירועי מוזיאון האצ"ל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --etzel-blue: #0e1b2e; --etzel-gold: #b8874e;
    --bg: #f4f1ec; --card-bg: #fff; --text: #222; --muted: #666; --danger: #a4332c;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  .hero h1, .event-card h2 { font-family: 'Frank Ruhl Libre', Georgia, serif; }
  .icon { width: 16px; height: 16px; vertical-align: -3px; margin-inline-end: 5px; fill: currentColor; flex-shrink: 0; }

  .hero {
    position: relative; padding: 70px 20px 60px; text-align: center; color: #fff;
    background: linear-gradient(rgba(14,27,46,0.82), rgba(14,27,46,0.9)), url('background.jpg');
    background-size: cover; background-position: center;
  }
  .hero h1 { margin: 0 0 8px; font-size: 2em; letter-spacing: 0.5px; }
  .hero p { margin: 0; color: #e7d6bd; font-size: 1.05em; }
  .hero::after { content: ""; position: absolute; bottom: 0; right: 0; left: 0; height: 4px; background: var(--etzel-gold); }

  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 60px; }

  .event-card { background: var(--card-bg); border-radius: 14px; box-shadow: 0 4px 18px rgba(14,27,46,0.12); overflow: hidden; margin-bottom: 30px; }
  .event-image { width: 100%; max-height: 340px; object-fit: contain; display: block; background: #e5ded0; }
  .event-body { padding: 22px 24px 24px; }
  .event-card h2 { margin: 0 0 8px; color: var(--etzel-blue); font-size: 1.4em; }
  .event-desc { color: var(--muted); margin-bottom: 18px; white-space: pre-line; line-height: 1.5; }

  .session-row { border-top: 1px solid #eee; padding: 16px 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .session-info b { display: block; color: var(--etzel-blue); font-size: 1.05em; }
  .session-info span { color: var(--muted); font-size: 0.9em; }
  .spots-left { font-weight: bold; color: var(--etzel-gold); }
  .spots-left.low { color: var(--danger); }

  button { font-family: inherit; cursor: pointer; border: none; border-radius: 24px; padding: 10px 22px; font-size: 0.95em; transition: 0.15s; }
  .btn-primary { background: var(--etzel-gold); color: #fff; font-weight: 600; }
  .btn-primary:hover { background: var(--etzel-blue); }
  .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

  .reg-form, .cancel-form { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px dashed #ddd; width: 100%; }
  .reg-form.open, .cancel-form.open { display: block; }
  .reg-form label, .cancel-form label { display: block; font-size: 0.9em; margin: 10px 0 4px; color: var(--muted); }
  .reg-form input, .cancel-form input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1em; font-family: inherit; }
  .reg-form input:focus, .cancel-form input:focus { outline: none; border-color: var(--etzel-gold); }
  .reg-form .actions, .cancel-form .actions { margin-top: 14px; display: flex; gap: 10px; }

  .btn-link { background: none; color: var(--muted); text-decoration: underline; padding: 6px 4px; font-size: 0.85em; border-radius: 0; }
  .btn-link:hover { color: var(--etzel-blue); }
  .session-actions { display: flex; align-items: center; gap: 10px; }

  .msg { margin-top: 10px; font-size: 0.9em; padding: 8px 10px; border-radius: 6px; }
  .msg.error { background: #fdecea; color: var(--danger); }
  .msg.success { background: #eaf3e3; color: #3f6b2c; }

  .empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }
  footer { text-align: center; color: var(--muted); font-size: 0.85em; padding: 20px; }

  .skeleton-card { background: var(--card-bg); border-radius: 14px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 4px 18px rgba(14,27,46,0.08); }
  .skeleton-block { background: linear-gradient(90deg, #ece7dd 25%, #f6f3ec 50%, #ece7dd 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skeleton-image { height: 200px; }
  .skeleton-line { height: 16px; margin: 18px 24px; border-radius: 4px; }
  .skeleton-line.short { width: 40%; }

  .event-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .btn-share { background: none; border: 1px solid #ddd; color: var(--muted); border-radius: 50%; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .btn-share:hover { border-color: var(--etzel-gold); color: var(--etzel-gold); }
  .share-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--etzel-blue); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 0.9em; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10; }
  .share-toast.show { opacity: 1; }

  .waitlist-form { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px dashed #ddd; width: 100%; }
  .waitlist-form.open { display: block; }
  .waitlist-form label { display: block; font-size: 0.9em; margin: 10px 0 4px; color: var(--muted); }
  .waitlist-form input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1em; font-family: inherit; }
  .waitlist-form .actions { margin-top: 14px; display: flex; gap: 10px; }
  .btn-outline { background: none; border: 2px solid var(--etzel-gold); color: var(--etzel-gold); font-weight: 600; }
  .btn-outline:hover { background: var(--etzel-gold); color: #fff; }

  .ended-events { margin-top: 10px; }
  .ended-events summary { cursor: pointer; color: var(--muted); font-size: 0.95em; padding: 10px 0; }
  .ended-event-row { padding: 10px 0; border-top: 1px solid #eee; }
  .ended-event-row b { color: var(--muted); }
</style>
</head>
<body>

<div class="hero">
  <h1>מוזיאון האצ"ל</h1>
  <p>המלך ג'ורג' 38, תל אביב-יפו, 6329802 · טלפון: 03-528-4001</p>
</div>

<main id="eventsContainer">
  <div class="skeleton-card"><div class="skeleton-block skeleton-image"></div><div class="skeleton-block skeleton-line"></div><div class="skeleton-block skeleton-line short"></div></div>
  <div class="skeleton-card"><div class="skeleton-block skeleton-line"></div><div class="skeleton-block skeleton-line short"></div></div>
</main>

<div class="share-toast" id="shareToast">הקישור הועתק!</div>

<footer>מוזיאון האצ"ל</footer>

<script type="module">
import { db } from './firebase-init.js';
import {
  collection, getDocs, getDoc, setDoc, doc, runTransaction, serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const container = document.getElementById('eventsContainer');

const ICON_CALENDAR = '<svg class="icon" viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm12 8v10H5V10h14z"/></svg>';
const ICON_CLOCK = '<svg class="icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm-1 2v6.41l4.29 4.3 1.42-1.42L13 11.59V6h-2z"/></svg>';
const ICON_SHARE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a2.98 2.98 0 0 0 0-1.4l7.05-4.11c.54.5 1.25.81 2.04.81a3 3 0 1 0-3-3c0 .24.04.47.09.7L8.04 9.81a3 3 0 1 0 0 4.38l7.13 4.16c-.05.21-.08.43-.08.65a2.99 2.99 0 1 0 3-3z"/></svg>';

async function loadEvents() {
  const eventsSnap = await getDocs(collection(db, 'events'));
  const events = eventsSnap.docs.filter(d => d.data().active !== false);

  if (events.length === 0) {
    container.innerHTML = '<div class="empty-state">אין כרגע אירועים פתוחים להרשמה.</div>';
    return;
  }

  const now = nowDateTimeString();
  const upcoming = [];
  const ended = [];

  for (const eventDoc of events) {
    const event = eventDoc.data();
    const sessionsSnap = await getDocs(query(collection(db, 'events', eventDoc.id, 'sessions'), orderBy('dateTime')));
    const allSessions = sessionsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    const futureSessions = allSessions.filter(s => !s.dateTime || s.dateTime >= now);

    if (allSessions.length > 0 && futureSessions.length === 0) {
      ended.push({ id: eventDoc.id, event });
    } else {
      const soonest = futureSessions.length ? futureSessions[0].dateTime : '9999';
      upcoming.push({ id: eventDoc.id, event, futureSessions, sortKey: soonest || '9999' });
    }
  }

  upcoming.sort((a, b) => a.sortKey.localeCompare(b.sortKey));

  container.innerHTML = '';
  for (const { id, event, futureSessions } of upcoming) {
    const card = document.createElement('div');
    card.className = 'event-card';
    card.id = `event-${id}`;

    let sessionsHtml = futureSessions.map(s => {
      const spotsLeft = s.capacity - (s.registeredCount || 0);
      return renderSession(id, s.id, s, spotsLeft, event.title);
    }).join('');

    if (!sessionsHtml) {
      sessionsHtml = '<p class="empty-state" style="padding:20px 0;">אין סבבים פתוחים לאירוע זה כרגע.</p>';
    }

    const imageHtml = event.imageUrl
      ? `<img class="event-image" src="${escapeHtml(event.imageUrl)}" alt="${escapeHtml(event.title || '')}">`
      : '';

    card.innerHTML = `
      ${imageHtml}
      <div class="event-body">
        <div class="event-header">
          <h2>${escapeHtml(event.title || '')}</h2>
          <button type="button" class="btn-share" data-event="${id}" data-title="${escapeHtml(event.title || '')}" aria-label="שתף אירוע">${ICON_SHARE}</button>
        </div>
        <div class="event-desc">${escapeHtml(event.description || '')}</div>
        ${sessionsHtml}
      </div>
    `;
    container.appendChild(card);
  }

  if (ended.length > 0) {
    const details = document.createElement('details');
    details.className = 'ended-events';
    const rows = ended.map(({ event }) => `
      <div class="ended-event-row">
        <b>${escapeHtml(event.title || '')}</b>
        <div class="muted" style="font-size:0.9em;">${escapeHtml(event.description || '')}</div>
      </div>
    `).join('');
    details.innerHTML = `<summary>אירועים שהסתיימו (${ended.length})</summary>${rows}`;
    container.appendChild(details);
  }

  attachHandlers();
  scrollToHashEvent();
}

function scrollToHashEvent() {
  if (!location.hash) return;
  const el = document.querySelector(location.hash);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderSession(eventId, sessionId, s, spotsLeft, eventTitle) {
  const full = spotsLeft <= 0;
  return `
    <div class="session-row" data-event="${eventId}" data-session="${sessionId}" data-datetime="${escapeHtml(s.dateTime || '')}" data-title="${escapeHtml(eventTitle || '')}">
      <div class="session-info">
        <b><bdi dir="ltr">${ICON_CALENDAR}${formatDate(s.date)} · ${ICON_CLOCK}${escapeHtml(s.time)}</bdi></b>
        <span class="spots-left ${spotsLeft <= 3 ? 'low' : ''}">${full ? 'אין מקומות פנויים' : spotsLeft + ' מקומות פנויים'}</span>
      </div>
      <div class="session-actions">
        ${full
          ? '<button type="button" class="btn-outline btn-toggle-waitlist">הצטרפ/י לרשימת המתנה</button>'
          : '<button class="btn-primary btn-toggle-form">הירשם</button>'}
        <button type="button" class="btn-link btn-toggle-cancel">ביטול הרשמה</button>
      </div>
      <form class="reg-form">
        <div class="form-fields">
          <label>שם מלא</label>
          <input type="text" name="name" required>
          <label>טלפון</label>
          <input type="tel" name="phone" required>
          <label>אימייל (אופציונלי)</label>
          <input type="email" name="email">
          <label>טלפון נוסף (אופציונלי)</label>
          <input type="tel" name="phone2">
          <label>מספר אנשים</label>
          <input type="number" name="partySize" min="1" max="${spotsLeft}" value="1" required>
          <div class="actions">
            <button type="submit" class="btn-primary">שלח הרשמה</button>
          </div>
          <div class="msg" style="display:none;"></div>
        </div>
        <div class="form-result" style="display:none;">
          <div class="msg"></div>
          <div class="actions">
            <a class="btn-primary btn-add-calendar hidden-link" target="_blank" rel="noopener" style="text-decoration:none; display:none;">הוסף ליומן</a>
            <button type="button" class="btn-primary btn-close-result">סגור</button>
          </div>
        </div>
      </form>
      <form class="waitlist-form">
        <div class="form-fields">
          <p class="muted" style="margin:0 0 10px; font-size:0.85em;">הסבב מלא. נרשום אתכם לרשימת המתנה, וניצור קשר אם יתפנה מקום.</p>
          <label>שם מלא</label>
          <input type="text" name="name" required>
          <label>טלפון</label>
          <input type="tel" name="phone" required>
          <label>אימייל (אופציונלי)</label>
          <input type="email" name="email">
          <label>טלפון נוסף (אופציונלי)</label>
          <input type="tel" name="phone2">
          <label>מספר אנשים</label>
          <input type="number" name="partySize" min="1" value="1" required>
          <div class="actions">
            <button type="submit" class="btn-primary">הצטרפ/י לרשימת המתנה</button>
          </div>
          <div class="msg" style="display:none;"></div>
        </div>
        <div class="form-result" style="display:none;">
          <div class="msg"></div>
          <div class="actions">
            <button type="button" class="btn-primary btn-close-result">סגור</button>
          </div>
        </div>
      </form>
      <form class="cancel-form">
        <div class="form-fields">
          <p class="muted" style="margin:0 0 10px; font-size:0.85em;">הכנס/י שוב את השם והטלפון שאיתם נרשמת כדי לבטל.</p>
          <label>שם מלא</label>
          <input type="text" name="name" required>
          <label>טלפון</label>
          <input type="tel" name="phone" required>
          <div class="actions">
            <button type="submit" class="btn-primary">בטל הרשמה</button>
          </div>
        </div>
        <div class="form-result" style="display:none;">
          <div class="msg"></div>
          <div class="actions">
            <button type="button" class="btn-primary btn-close-result">סגור</button>
          </div>
        </div>
      </form>
    </div>
  `;
}

function attachHandlers() {
  container.querySelectorAll('.btn-toggle-form').forEach(btn => {
    btn.addEventListener('click', () => {
      const form = btn.closest('.session-row').querySelector('.reg-form');
      form.classList.toggle('open');
    });
  });

  container.querySelectorAll('.btn-toggle-cancel').forEach(btn => {
    btn.addEventListener('click', () => {
      const form = btn.closest('.session-row').querySelector('.cancel-form');
      form.classList.toggle('open');
    });
  });

  container.querySelectorAll('.btn-toggle-waitlist').forEach(btn => {
    btn.addEventListener('click', () => {
      const form = btn.closest('.session-row').querySelector('.waitlist-form');
      form.classList.toggle('open');
    });
  });

  container.querySelectorAll('.waitlist-form').forEach(form => {
    const fields = form.querySelector('.form-fields');
    const result = form.querySelector('.form-result');
    const resultMsg = result.querySelector('.msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const row = form.closest('.session-row');
      const eventId = row.dataset.event;
      const sessionId = row.dataset.session;
      const submitBtn = form.querySelector('button[type="submit"]');
      const name = form.name.value.trim();
      const phone = form.phone.value.trim();
      const email = form.email.value.trim();
      const phone2 = form.phone2.value.trim();
      const partySize = parseInt(form.partySize.value, 10);

      submitBtn.disabled = true;

      try {
        await joinWaitlist(eventId, sessionId, { name, phone, email, phone2, partySize });
        resultMsg.className = 'msg success';
        resultMsg.textContent = 'נרשמת לרשימת ההמתנה. ניצור קשר אם יתפנה מקום.';
      } catch (err) {
        resultMsg.className = 'msg error';
        resultMsg.textContent = err.message || 'שגיאה, נסו שוב.';
      }

      fields.style.display = 'none';
      result.style.display = 'block';
      submitBtn.disabled = false;
    });

    result.querySelector('.btn-close-result').addEventListener('click', () => {
      loadEvents();
    });
  });

  container.querySelectorAll('.btn-share').forEach(btn => {
    btn.addEventListener('click', async () => {
      const url = `${location.origin}${location.pathname}#event-${btn.dataset.event}`;
      if (navigator.share) {
        try { await navigator.share({ title: btn.dataset.title, url }); } catch (e) { /* user cancelled */ }
      } else {
        try {
          await navigator.clipboard.writeText(url);
          showToast();
        } catch (e) {
          prompt('העתק/י את הקישור:', url);
        }
      }
    });
  });

  container.querySelectorAll('.cancel-form').forEach(form => {
    const fields = form.querySelector('.form-fields');
    const result = form.querySelector('.form-result');
    const resultMsg = result.querySelector('.msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const row = form.closest('.session-row');
      const eventId = row.dataset.event;
      const sessionId = row.dataset.session;
      const submitBtn = form.querySelector('button[type="submit"]');
      const name = form.name.value.trim();
      const phone = form.phone.value.trim();

      submitBtn.disabled = true;

      try {
        await cancelRegistration(eventId, sessionId, { name, phone });
        resultMsg.className = 'msg success';
        resultMsg.textContent = 'ההרשמה בוטלה בהצלחה.';
      } catch (err) {
        resultMsg.className = 'msg error';
        resultMsg.textContent = err.message || 'שגיאה בביטול, נסו שוב.';
      }

      fields.style.display = 'none';
      result.style.display = 'block';
      submitBtn.disabled = false;
    });

    result.querySelector('.btn-close-result').addEventListener('click', () => {
      loadEvents();
    });
  });

  container.querySelectorAll('.reg-form').forEach(form => {
    const fields = form.querySelector('.form-fields');
    const result = form.querySelector('.form-result');
    const resultMsg = result.querySelector('.msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const row = form.closest('.session-row');
      const eventId = row.dataset.event;
      const sessionId = row.dataset.session;
      const submitBtn = form.querySelector('button[type="submit"]');
      const name = form.name.value.trim();
      const phone = form.phone.value.trim();
      const email = form.email.value.trim();
      const phone2 = form.phone2.value.trim();
      const partySize = parseInt(form.partySize.value, 10);

      submitBtn.disabled = true;

      const calendarLink = result.querySelector('.btn-add-calendar');

      try {
        await registerForSession(eventId, sessionId, { name, phone, email, phone2, partySize });
        resultMsg.className = 'msg success';
        resultMsg.textContent = 'ההרשמה נקלטה בהצלחה!';
        calendarLink.href = buildCalendarLink(row.dataset.title, row.dataset.datetime);
        calendarLink.style.display = 'inline-block';
      } catch (err) {
        resultMsg.className = 'msg error';
        resultMsg.textContent = err.message || 'שגיאה בהרשמה, נסו שוב.';
        calendarLink.style.display = 'none';
      }

      fields.style.display = 'none';
      result.style.display = 'block';
      submitBtn.disabled = false;
    });

    result.querySelector('.btn-close-result').addEventListener('click', () => {
      loadEvents();
    });
  });
}

function normalizeName(name) {
  return (name || '').trim().replace(/\s+/g, ' ').toLowerCase();
}

function normalizePhone(phone) {
  return (phone || '').replace(/\D/g, '');
}

// A simple, stable (non-cryptographic) hash - just needs to turn the same
// name+phone into the same Firestore doc ID every time, both at registration
// and at cancellation.
function hashString(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16);
}

function registrationId(sessionId, name, phone) {
  return hashString(`${sessionId}|${normalizeName(name)}|${normalizePhone(phone)}`);
}

async function registerForSession(eventId, sessionId, { name, phone, email, phone2, partySize }) {
  const sessionRef = doc(db, 'events', eventId, 'sessions', sessionId);
  const regRef = doc(db, 'events', eventId, 'sessions', sessionId, 'registrations', registrationId(sessionId, name, phone));

  await runTransaction(db, async (tx) => {
    const [sessionSnap, regSnap] = [await tx.get(sessionRef), await tx.get(regRef)];
    if (!sessionSnap.exists()) throw new Error('הסבב לא נמצא.');
    if (regSnap.exists()) throw new Error('כבר קיימת הרשמה עם השם והטלפון האלה לסבב הזה.');
    const data = sessionSnap.data();
    const newCount = (data.registeredCount || 0) + partySize;
    if (newCount > data.capacity) {
      throw new Error('אין מספיק מקומות פנויים לכמות המבוקשת.');
    }
    tx.update(sessionRef, { registeredCount: newCount });
    tx.set(regRef, { name, phone, email: email || '', phone2: phone2 || '', partySize, createdAt: serverTimestamp() });
  });
}

async function joinWaitlist(eventId, sessionId, { name, phone, email, phone2, partySize }) {
  const wlRef = doc(db, 'events', eventId, 'sessions', sessionId, 'waitlist', registrationId(sessionId, name, phone));
  const wlSnap = await getDoc(wlRef);
  if (wlSnap.exists()) throw new Error('כבר נרשמת לרשימת ההמתנה עם הפרטים האלה.');
  await setDoc(wlRef, { name, phone, email: email || '', phone2: phone2 || '', partySize, createdAt: serverTimestamp() });
}

function showToast() {
  const toast = document.getElementById('shareToast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

async function cancelRegistration(eventId, sessionId, { name, phone }) {
  const sessionRef = doc(db, 'events', eventId, 'sessions', sessionId);
  const regRef = doc(db, 'events', eventId, 'sessions', sessionId, 'registrations', registrationId(sessionId, name, phone));

  await runTransaction(db, async (tx) => {
    const [sessionSnap, regSnap] = [await tx.get(sessionRef), await tx.get(regRef)];
    if (!regSnap.exists()) throw new Error('לא נמצאה הרשמה תואמת לשם ולטלפון שהוזנו.');
    const partySize = regSnap.data().partySize || 0;
    const newCount = Math.max(0, (sessionSnap.data().registeredCount || 0) - partySize);
    tx.delete(regRef);
    tx.update(sessionRef, { registeredCount: newCount });
  });
}

function formatDate(dateStr) {
  const [y, m, d] = (dateStr || '').split('-');
  if (!y || !m || !d) return escapeHtml(dateStr || '');
  return `${d}/${m}/${y}`;
}

function nowDateTimeString() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

const MUSEUM_ADDRESS = 'המלך ג\'ורג\' 38, תל אביב-יפו, 6329802';
const DEFAULT_EVENT_DURATION_MIN = 90;

function buildCalendarLink(title, dateTimeStr) {
  if (!dateTimeStr) return '#';
  const start = new Date(dateTimeStr);
  if (isNaN(start)) return '#';
  const end = new Date(start.getTime() + DEFAULT_EVENT_DURATION_MIN * 60000);
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title || 'אירוע במוזיאון האצ"ל',
    dates: `${fmt(start)}/${fmt(end)}`,
    location: MUSEUM_ADDRESS
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadEvents().catch(err => {
  container.innerHTML = '<div class="empty-state">שגיאה בטעינת האירועים.</div>';
  console.error(err);
});
