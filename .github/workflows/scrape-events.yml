name: Scrape museum events

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run scraper
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scrape-events.js

      - name: Record this run (keeps the schedule from being auto-disabled after 60 idle days)
        run: |
          git config user.name "etzel-events-bot"
          git config user.email "actions@github.com"
          git add scripts/last-scrape.json
          git diff --staged --quiet || git commit -m "chore: record scrape run"
          git push
